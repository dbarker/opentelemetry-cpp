name: CMake Install Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  cmake_install_functions:
    name: CMake ${{ matrix.cmake_version }} install functions test (ubuntu-26.04)
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        cmake_version: ['3.16.0', '3.31.6', '4.5.0']
    env:
      INSTALL_TEST_DIR: '/home/runner/install_test'
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: 'recursive'
    - name: Setup CI Environment
      run: |
        sudo ./ci/setup_ci_environment.sh
    - name: Install CMake
      run: |
        sudo env "CMAKE_VERSION=${{ matrix.cmake_version }}" ./ci/setup_cmake.sh
    - name: Run Install Functions Tests
      run: ./ci/do_ci.sh cmake.install_functions.test

  windows_2022_vcpkg_submodule:
    name: Windows 2022 vcpkg submodule versions cxx17 (static libs - dll)
    needs: cmake_install_functions
    runs-on: windows-2022
    env:
      # cxx17 is the default for windows-2022
      CXX_STANDARD: '17'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: 'recursive'
      - name: Build dependencies with vcpkg submodule
        run: |
          ./ci/setup_windows_ci_environment.ps1
      - name: Run Tests
        run: ./ci/do_ci.ps1 cmake.install.test
      - name: Run DLL Tests
        run: ./ci/do_ci.ps1 cmake.dll.install.test

  windows_2025_vcpkg_submodule:
    name: Windows 2025 vcpkg submodule versions cxx20 (static libs)
    needs: cmake_install_functions
    runs-on: windows-2025
    env:
      CXX_STANDARD: '20'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: 'recursive'
      - name: Build dependencies with vcpkg submodule
        run: |
          ./ci/setup_windows_ci_environment.ps1
      - name: Run Tests
        run: ./ci/do_ci.ps1 cmake.install.test

  ubuntu_system_packages:
    name: ${{ matrix.os }} apt packages cxx17 (static libs - shared libs)
    needs: cmake_install_functions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    env:
      INSTALL_TEST_DIR: '/home/runner/install_test'
      CXX_STANDARD: '17'
      BUILD_TYPE: 'Debug'
      # Enable the pkg-config consumer test for this system-package job only.
      # Static and shared steps both inherit this and run cmake.install.test.
      OTEL_ENABLE_PKGCONFIG_INSTALL_TEST: 'ON'
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: 'recursive'
    - name: Setup CI Environment
      run: |
        sudo -E ./ci/setup_ci_environment.sh
    - name: Install Dependencies
      run: |
        sudo -E apt-get update
        # libcurl.pc --static emits unversioned private libs (nghttp2, idn2, rtmp,
        # ssh, psl, gssapi_krb5, lber/ldap, brotlidec, gpg-error, unistring).
        # libcurl4-openssl-dev pulls only the runtime SONAMEs; the matching -dev
        # packages provide the linker names. Do not encode these in OTel .pc files.
        sudo -E apt-get install -y libabsl-dev libcurl4-openssl-dev zlib1g-dev nlohmann-json3-dev libprotobuf-dev libgrpc++-dev protobuf-compiler protobuf-compiler-grpc libnghttp2-dev libidn2-dev librtmp-dev libssh-dev libpsl-dev libkrb5-dev libldap2-dev libbrotli-dev libgpg-error-dev libunistring-dev
        sudo -E ./ci/install_thirdparty.sh --install-dir /usr/local --build-type Release --tags-file third_party_release --packages "googletest;benchmark"
    - name: Run Tests (static libs)
      env:
        BUILD_SHARED_LIBS: 'OFF'
      run: ./ci/do_ci.sh cmake.install.test
    - name: Run Tests (shared libs)
      env:
        BUILD_SHARED_LIBS: 'ON'
      run: ./ci/do_ci.sh cmake.install.test

  ubuntu_thirdparty_packages:
    name: ${{ matrix.os }} ${{ matrix.versions }} versions cxx${{ matrix.cxx_standard }} (static libs - shared libs)
    needs: cmake_install_functions
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, versions: latest, cxx_standard: '20', cmake_version: '4.5.0' }
          - { os: ubuntu-24.04, versions: stable, cxx_standard: '17', cmake_version: '3.31.6' }
          # 3.16.0 is the current minimum version of cmake
          - { os: ubuntu-22.04, versions: minimum, cxx_standard: '14', cmake_version: '3.16.0' }
    env:
      INSTALL_TEST_DIR: '/home/runner/install_test'
      CXX_STANDARD: ${{ matrix.cxx_standard }}
      BUILD_TYPE: 'Debug'
      # opentracing-cpp is omitted; cmake.install.test (ABI v2) does not build the opentracing shim
      THIRDPARTY_PACKAGES: 'abseil;zlib;curl;protobuf;grpc;benchmark;googletest;ms-gsl;nlohmann-json;opentelemetry-proto;prometheus-cpp;ryml'
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: 'recursive'
    - name: Setup CI Environment
      run: |
        sudo -E ./ci/setup_ci_environment.sh
    - name: Install CMake
      run: |
        sudo env "CMAKE_VERSION=${{ matrix.cmake_version }}" ./ci/setup_cmake.sh
    - name: Install Dependencies
      run: |
        sudo env "CXX_STANDARD=$CXX_STANDARD" ./ci/install_thirdparty.sh --install-dir /usr/local --build-type Release --tags-file install/cmake/third_party_${{ matrix.versions }} --packages "$THIRDPARTY_PACKAGES"
    - name: Run Tests (static libs)
      env:
        BUILD_SHARED_LIBS: 'OFF'
      run: ./ci/do_ci.sh cmake.install.test
    - name: Run Tests (shared libs)
      env:
        BUILD_SHARED_LIBS: 'ON'
      run: ./ci/do_ci.sh cmake.install.test

  ubuntu_2404_conan_latest:
    name: Ubuntu 24.04 conan latest versions cxx17 (static libs - opentracing shim)
    needs: cmake_install_functions
    runs-on: ubuntu-24.04
    env:
      INSTALL_TEST_DIR: '/home/runner/install_test'
      CXX_STANDARD: '17'
      BUILD_TYPE: 'Release'
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: 'recursive'
      - name: Free Disk Space
        run: ./ci/free_disk_space.sh
      - name: Install Conan
        run: |
          python3 -m pip install pip==25.0.1
          pip install "conan==2.21.0"
          conan profile detect --force
          sudo apt-get install -y lld
      - name: Install or build all dependencies with Conan
        run: |
          # Limit concurrent links and use lld to reduce memory when linking the static gRPC tests
          conan install install/conan/conanfile_latest.txt --build=missing -of /home/runner/conan -s build_type=${BUILD_TYPE} -s compiler.cppstd=${CXX_STANDARD} \
            -c '&:tools.cmake.cmaketoolchain:extra_variables={"CMAKE_JOB_POOLS": "link=2", "CMAKE_JOB_POOL_LINK": "link"}' \
            -c '&:tools.build:exelinkflags=["-fuse-ld=lld"]' \
            -c '&:tools.build:sharedlinkflags=["-fuse-ld=lld"]'
          conan cache clean --source --build --download --temp
          echo "CMAKE_TOOLCHAIN_FILE=/home/runner/conan/build/Release/generators/conan_toolchain.cmake" >> "$GITHUB_ENV"
      - name: Run Tests (static libs)
        env:
          BUILD_SHARED_LIBS: 'OFF'
        run: ./ci/do_ci.sh cmake.install.test
      - name: verify pkgconfig packages
        run: |
          export PKG_CONFIG_PATH=$INSTALL_TEST_DIR/lib/pkgconfig:$PKG_CONFIG_PATH
          ./ci/verify_packages.sh
      - name: Run OpenTracing Shim Test
        run: ./ci/do_ci.sh cmake.opentracing_shim.install.test

  macos_conan_latest:
    name: macOS conan latest versions cxx17 (static libs)
    needs: cmake_install_functions
    runs-on: macos-26
    env:
      INSTALL_TEST_DIR: '/Users/runner/install_test'
      CXX_STANDARD: '17'
      CMAKE_VERSION: 3.31.0 # building the conan "stable" versions requires CMake 3.x
      BUILD_TYPE: 'Release'
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: 'recursive'
    - name: Install CMake
      run: |
        ./ci/setup_cmake_macos.sh
    - name: Install Conan and tools
      run: |
        brew install conan autoconf automake libtool coreutils
        conan profile detect --force
    - name: Install or build all dependencies with Conan
      run: |
        conan install install/conan/conanfile_latest.txt --build=missing -of /Users/runner/conan -s build_type=${BUILD_TYPE} -s compiler.cppstd=${CXX_STANDARD} \
          -c '&:tools.cmake.cmaketoolchain:extra_variables={"CMAKE_JOB_POOLS": "link=2", "CMAKE_JOB_POOL_LINK": "link"}'
        conan cache clean --source --build --download --temp
        echo "CMAKE_TOOLCHAIN_FILE=/Users/runner/conan/build/Release/generators/conan_toolchain.cmake" >> "$GITHUB_ENV"
    - name: Run Tests (static libs)
      env:
        BUILD_SHARED_LIBS: 'OFF'
      run: ./ci/do_ci.sh cmake.install.test

  macos_brew_packages:
    name: macOS brew latest versions cxx17 (static libs)
    needs: cmake_install_functions
    runs-on: macos-26
    env:
      INSTALL_TEST_DIR: '/Users/runner/install_test'
      CXX_STANDARD: '17'
      BUILD_TYPE: 'Debug'
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        submodules: 'recursive'
    - name: Install Dependencies with Homebrew
      run: |
        brew install coreutils
        brew install googletest
        brew install google-benchmark
        brew install zlib
        brew install abseil
        brew install protobuf
        brew install grpc
        brew install nlohmann-json
        brew install prometheus-cpp
    - name: Run Tests (static libs)
      env:
        BUILD_SHARED_LIBS: 'OFF'
      run: ./ci/do_ci.sh cmake.install.test
